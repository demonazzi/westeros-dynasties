# GitLab Pages: страница — index.html в корне репозитория (её пишет python3 tools/build.py)
pages:
  stage: deploy
  image: alpine:3.20
  script:
    - mkdir -p public
    - cp index.html public/index.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
